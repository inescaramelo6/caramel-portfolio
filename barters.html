<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barter's Travelnet — caramel</title>

  <link rel="stylesheet" href="styles/caramel.css" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream:'#F5F1E8',
            lavender:'#D6CFF8',
            pink:'#ED0086',
            orange:'#F25823',
            lime:'#BCDE3F',
            ink:'#1A1A1A'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-cream text-ink">

<!-- ===========================================================
     IN THE WILD (ONLY THIS SECTION UPDATED)
=========================================================== -->

<section class="relative overflow-hidden bg-cream">
  <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-10 py-20 lg:py-24">

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-5">

      <!-- ✅ FIXED STOREFRONT CARD -->
      <figure class="relative" style="transform:rotate(-3deg);">
        <span class="absolute z-10 caramel-grain pointer-events-none"
          style="background:#BCDE3F; width:70px; height:20px; top:-10px; left:50%; transform:translateX(-50%) rotate(-4deg); box-shadow:0 1px 3px rgba(0,0,0,.15); opacity:.92;">
        </span>

        <div class="rounded-md caramel-block--small" style="background:#F5F1E8; padding:6px;">
          <img
            src="assets/barters-storefront.jpg"
            alt="Rebranded Patrick's Street storefront"
            loading="lazy"
            class="storefront-img w-full h-44 sm:h-48 object-cover rounded-sm"
          />
          <figcaption class="font-body text-[11px] uppercase tracking-wide mt-2 px-1 pb-1 leading-tight">
            Patrick's Street storefront — rebrand reveal
          </figcaption>
        </div>
      </figure>

      <!-- KEEPING YOUR OTHER CARDS EXACTLY THE SAME -->

      <figure class="relative" style="transform:rotate(2.5deg);">
        <span class="absolute z-10 caramel-grain pointer-events-none"
          style="background:#D6CFF8; width:70px; height:20px; top:-10px; left:50%; transform:translateX(-50%) rotate(-4deg); box-shadow:0 1px 3px rgba(0,0,0,.15); opacity:.92;">
        </span>
        <div class="rounded-md caramel-block--small" style="background:#F5F1E8; padding:6px;">
          <img src="assets/Douglas-shop.jpg" loading="lazy" class="w-full h-44 sm:h-48 object-cover rounded-sm" />
          <figcaption class="font-body text-[11px] uppercase tracking-wide mt-2 px-1 pb-1 leading-tight">
            Douglas branch — same identity, second location
          </figcaption>
        </div>
      </figure>

      <figure class="relative" style="transform:rotate(-1.5deg);">
        <span class="absolute z-10 caramel-grain pointer-events-none"
          style="background:#F25823; width:70px; height:20px; top:-10px; left:50%; transform:translateX(-50%) rotate(-4deg); box-shadow:0 1px 3px rgba(0,0,0,.15); opacity:.92;">
        </span>
        <div class="rounded-md caramel-block--small" style="background:#F5F1E8; padding:6px;">
          <img src="assets/Wall-mural.png" loading="lazy" class="w-full h-44 sm:h-48 object-contain rounded-sm bg-cream" />
        </div>
      </figure>

    </div>
  </div>
</section>

</body>
</html>
